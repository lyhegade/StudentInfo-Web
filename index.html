<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/style.css">
    <title>Document</title>
</head>

<body>

    <div class="main-container">

        <div class="col1">

            <div class="header">
                <h1>Student Information</h1>
                <input type="button" value="Add" id="add-btn" class="button btn-add">
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Lastname</th>
                            <th>Firstname</th>
                            <th>Middlename</th>
                            <th>Gender</th>
                            <th>Year-Level</th>
                            <th>Section</th>
                            <th>Email</th>
                        </tr>
                    </thead>

                    <tbody id="student-data">
                    </tbody>

                </table>
            </div>

        </div>

        <div class="col2">
            <div class="col2-header-container">
                <div class="col2-header">
                    <h2>Student Information</h2>
                    <p>Select a Student to see details</p>
                </div>

                <input type="button" value="Edit" id="edit-btn" class="button btn-edit">
                <input type="button" value="Delete" id="delete-btn" class="button btn-delete">
            </div>

            <div class="form-container">
                <form action="">

                    <div class="textbox">
                        <input type="text" id="txt-lastname" name="Lastname" required>
                        <label class="textbox-label" for="lastname">
                            <span class="placeholder" id="placeholder-lastname">Lastname </span>
                        </label>
                    </div>

                    <div class="textbox">
                        <input type="text" id="txt-firstname" name="Firstname" required>
                        <label class="textbox-label" for="firstname">
                            <span class="placeholder" id="placeholder-firstname">Firstname</span>
                        </label>
                    </div>

                    <div class="textbox">
                        <input type="text" id="txt-middlename" name="Middlename" required>
                        <label class="textbox-label" for="middlename">
                            <span class="placeholder" id="placeholder-middlename">Middlename</span>
                        </label>
                    </div>

                    <div class="textbox">
                        <input type="text" id="txt-gender" name="Gender" required>
                        <label class="textbox-label" for="gender">
                            <span class="placeholder" id="placeholder-gender">Gender</span>
                        </label>
                    </div>

                    <div class="textbox">
                        <input type="text" id="txt-year-level" name="Year-Level" required>
                        <label class="textbox-label" for="yearlevel">
                            <span class="placeholder" id="placeholder-year-level">Year-Level</span>
                        </label>
                    </div>

                    <div class="textbox">
                        <input type="text" id="txt-section" name="Section" required>
                        <label class="textbox-label" for="section">
                            <span class="placeholder" id="placeholder-section">Section</span>
                        </label>
                    </div>

                    <div class="textbox">
                        <input type="text" id="txt-email" name="Email" required>
                        <label class="textbox-label" for="email">
                            <span class="placeholder" id="placeholder-email">Email</span>
                        </label>
                    </div>

                    <div class="action-btn-container">

                        <input type="button"value="Save" id="save-btn" class="button btn-save">
                        <input type="button" value="Cancel" id="cancel-btn" class="button btn-cancel">
                    </div>

                </form>
            </div>

        </div>

    </div>
     <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <script src="./assets/js/scriptJQuery.js"></script>

    <!--<script type="module" src="./assets/js/script.js"></script>
    
</body>

</html>
